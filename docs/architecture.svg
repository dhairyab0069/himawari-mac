<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="How Himawari works: Music, Apple's catalog, a Core Audio tap and the power state feed modules inside Himawari; the WallpaperManager draws the wallpaper windows, answers the desktop clock, and the gear's click catchers send commands back to Music.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b5346"/></marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77d00"/></marker>
    <style>
      text{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#1d1a14}
      .t{font-size:14px;font-weight:600}.s{font-size:10.5px;fill:#6b6356}.l{font-size:10.5px;fill:#5b5346}.h{font-size:12px;font-weight:700;letter-spacing:.12em;fill:#8a6a1c}
      .src{fill:#eef4ff;stroke:#9db8e8}.mod{fill:#fff;stroke:#d9cfb9}.out{fill:#fff4dc;stroke:#e5b659}
      line,polyline{stroke:#5b5346;stroke-width:1.4;fill:none}.cmd{stroke:#c77d00;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#fbf7ee"/>
  <text x="20" y="32" class="h">MAC &amp; INTERNET</text>
  <text x="290" y="32" class="h">HIMAWARI.APP</text>
  <text x="760" y="32" class="h">ON YOUR SCREEN</text>

  <!-- sources -->
  <rect x="20" y="55" width="220" height="70" rx="10" class="src"/><text x="34" y="80" class="t">Music app</text><text x="34" y="98" class="s">what's playing, cover, position;</text><text x="34" y="113" class="s">takes play / seek / volume / EQ</text>
  <rect x="20" y="150" width="220" height="60" rx="10" class="src"/><text x="34" y="175" class="t">Apple Music catalog</text><text x="34" y="194" class="s">iTunes Search, album pages</text>
  <rect x="20" y="240" width="220" height="60" rx="10" class="src"/><text x="34" y="265" class="t">Core Audio process tap</text><text x="34" y="284" class="s">Music's sound, only measured</text>
  <rect x="20" y="312" width="220" height="44" rx="10" class="src"/><text x="34" y="331" class="t">Power &amp; windows</text><text x="34" y="347" class="s">battery, Low Power, covered</text>
  <rect x="20" y="390" width="220" height="50" rx="10" class="src"/><text x="34" y="412" class="t">You</text><text x="34" y="429" class="s">clicks and drags on the desktop</text>

  <!-- Himawari -->
  <rect x="285" y="45" width="425" height="455" rx="16" fill="none" stroke="#c9bd9f" stroke-width="1.5" stroke-dasharray="2 0"/>
  <rect x="305" y="60" width="190" height="70" rx="10" class="mod"/><text x="317" y="84" class="t">MusicNowPlaying</text><text x="317" y="101" class="s">Now Playing, via a helper;</text><text x="317" y="116" class="s">AppleScript as a fallback</text>
  <rect x="305" y="155" width="190" height="60" rx="10" class="mod"/><text x="317" y="179" class="t">MotionArtwork</text><text x="317" y="197" class="s">its own animated cover</text>
  <rect x="305" y="245" width="190" height="60" rx="10" class="mod"/><text x="317" y="269" class="t">AudioLevels</text><text x="317" y="287" class="s">FFT → VU needles, spectrum</text>
  <rect x="305" y="345" width="190" height="55" rx="10" class="mod"/><text x="317" y="368" class="t">LockScreen</text><text x="317" y="386" class="s">still frame, or an Aerial swap</text>
  <rect x="530" y="60" width="165" height="270" rx="10" class="mod" stroke="#c77d00" stroke-width="1.6"/>
  <text x="544" y="86" class="t">WallpaperManager</text>
  <text x="544" y="110" class="s">your video</text><text x="544" y="128" class="s">or the animated cover</text><text x="544" y="146" class="s">or the CD scene</text>
  <text x="544" y="170" class="s">+ the side gear</text><text x="544" y="194" class="s">disc-changer slides</text><text x="544" y="218" class="s">pause &amp; Battery Saver</text><text x="544" y="242" class="s">clock contrast readings</text>
  <rect x="530" y="385" width="165" height="65" rx="10" class="mod"/><text x="544" y="408" class="t">GearControls</text><text x="544" y="424" class="s">catchers over the gear;</text><text x="544" y="439" class="s">DesktopPeek hides files</text>

  <!-- outputs -->
  <rect x="760" y="55" width="220" height="70" rx="10" class="out"/><text x="774" y="80" class="t">Desktop Clock</text><text x="774" y="98" class="s">a helper Himawari starts; asks</text><text x="774" y="113" class="s">what's behind it, adapts its ink</text>
  <rect x="760" y="150" width="220" height="100" rx="10" class="out"/><text x="774" y="175" class="t">Wallpaper windows</text><text x="774" y="194" class="s">one per screen, just above the</text><text x="774" y="209" class="s">desktop picture, below the icons:</text><text x="774" y="224" class="s">video · cover · CD · rack gear</text>
  <rect x="760" y="280" width="220" height="55" rx="10" class="out"/><text x="774" y="303" class="t">Lock screen &amp; screen saver</text><text x="774" y="321" class="s">macOS wallpaper, Aerial videos</text>
  <rect x="760" y="390" width="220" height="55" rx="10" class="out"/><text x="774" y="413" class="t">Finder's desktop icons</text><text x="774" y="431" class="s">hidden and shown again</text>

  <!-- flows in -->
  <line x1="240" y1="82" x2="303" y2="82" marker-end="url(#a)"/><text x="248" y="76" class="l">state</text>
  <line x1="305" y1="112" x2="242" y2="112" class="cmd" marker-end="url(#s)"/><text x="244" y="126" class="l" style="fill:#c77d00">commands</text>
  <line x1="240" y1="185" x2="303" y2="185" marker-end="url(#a)"/><text x="246" y="179" class="l">album</text>
  <line x1="240" y1="275" x2="303" y2="275" marker-end="url(#a)"/><text x="248" y="269" class="l">samples</text>
  <line x1="240" y1="327" x2="528" y2="327" marker-end="url(#a)"/><text x="252" y="321" class="l">pause · Battery Saver</text>
  <line x1="240" y1="415" x2="528" y2="415" marker-end="url(#a)"/><text x="252" y="409" class="l">clicks, drags</text>
  <!-- inside -->
  <line x1="495" y1="82" x2="528" y2="82" marker-end="url(#a)"/>
  <line x1="495" y1="185" x2="528" y2="185" marker-end="url(#a)"/>
  <line x1="495" y1="275" x2="528" y2="275" marker-end="url(#a)"/>
  <polyline points="530,400 512,400 512,122 497,122" class="cmd" marker-end="url(#s)"/>
  <!-- flows out -->
  <line x1="695" y1="90" x2="758" y2="90" marker-end="url(#a)" marker-start="url(#a)"/><text x="702" y="84" class="l">tone</text>
  <line x1="695" y1="200" x2="758" y2="200" marker-end="url(#a)"/><text x="702" y="194" class="l">draws</text>
  <polyline points="495,372 725,372 725,308 758,308" marker-end="url(#a)"/><text x="610" y="366" class="l">sets</text>
  <line x1="695" y1="417" x2="758" y2="417" marker-end="url(#a)"/><text x="700" y="411" class="l">hide/show</text>
  <text x="305" y="480" class="s">Dashed orange: clicks on the gear and CD become Music commands.</text>
</svg>
